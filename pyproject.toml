[project]
name = "fiberfield"
version = "0.2.0"
description = "A neural field for adaptive white matter fiber modeling from diffusion MRI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cmcrameri>=1.9",
    "dipy>=1.11.0",
    "fury>=0.12.0",
    "numpy>=2.3.4",
    "pandas>=3.0.3",
    "seaborn>=0.13.2",
    "torch>=2.9.1",
    "torchquad>=0.5.0",
    "wandb>=0.23.0",
]

[project.scripts]
fixel2sparse = "fiberfield.scripts.fixel2sparse:main"
sparse2fixel = "fiberfield.scripts.sparse2fixel:main"
fixelview = "fiberfield.scripts.fixelview:main"
fiberfield = "fiberfield.scripts.fiberfield:main"
fixelmatch = "fiberfield.scripts.fixelmatch:main"
afd2fraction = "fiberfield.scripts.afd2fraction:main"