name: Build Docker + Singularity image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ github.event.repository.name }}
  DOCKERFILE: Dockerfile
  BUILD_CONTEXT: .

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Set image tag
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          NAME=$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME#v}"
          else
            TAG="sha-${GITHUB_SHA::7}"
          fi
          echo "owner=$OWNER"  >> "$GITHUB_OUTPUT"
          echo "name=$NAME"    >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"      >> "$GITHUB_OUTPUT"
          echo "local=$NAME:$TAG" >> "$GITHUB_OUTPUT"
          echo "remote=ghcr.io/$OWNER/$NAME:$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.DOCKERFILE }}
          load: true                      # keep it in the local daemon for conversion
          tags: |
            ${{ steps.meta.outputs.local }}
            ${{ steps.meta.outputs.remote }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Apptainer
        run: |
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update
          sudo apt-get install -y apptainer
          apptainer --version

      - name: Convert Docker image to .sif
        run: |
          SIF="${{ steps.meta.outputs.name }}_${{ steps.meta.outputs.tag }}.sif"
          apptainer build "$SIF" "docker-daemon://${{ steps.meta.outputs.local }}"
          apptainer inspect "$SIF"
          ls -lh "$SIF"
          echo "SIF=$SIF" >> "$GITHUB_ENV"

      - name: Check .sif exists
        run: apptainer exec "$SIF" cat /etc/os-release

      - name: Upload .sif as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SIF }}
          path: ${{ env.SIF }}
          compression-level: 0
          retention-days: 14

      # ---------- Publishing (tags only) ----------
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        if: startsWith(github.ref, 'refs/tags/v')
        run: docker push "${{ steps.meta.outputs.remote }}"

      # Pull later with: apptainer pull oras://ghcr.io/<owner>/<name>:<tag>-sif
      - name: Push .sif to GHCR (ORAS)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | apptainer registry login \
            --username "${{ github.actor }}" --password-stdin oras://ghcr.io
          apptainer push "$SIF" "oras://${{ steps.meta.outputs.remote }}-sif"

      - name: Attach .sif to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SIZE=$(stat -c%s "$SIF")
          if (( SIZE >= 2147483648 )); then
            echo "::warning::$SIF is over 2 GB; skipping release asset (use the ORAS copy instead)."
            exit 0
          fi
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" "$SIF" --clobber